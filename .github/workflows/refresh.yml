name: refresh

# Every 15 minutes: pull rounds of any running event (one cheap call per unfinished
# event when nothing is running), take a Duels snapshot once per event window, and
# look for new big events with public pairings once a day. Deploy only when data changed.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Pull new data
        if: github.event_name != 'push'
        run: python -m pipeline refresh
      - name: Commit data
        id: commit
        run: |
          git config user.name "lorcana-meta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase origin main
            git push -q
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site data
        run: python -m pipeline build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
